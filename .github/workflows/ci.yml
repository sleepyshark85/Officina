name: CI

# TEST-03: the suite runs offline, on Linux and Windows. Warnings are errors (Directory.Build.props).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # A hanging test fails the run with a dump instead of stalling CI. Linux, which runs every test, also measures
        # coverage of Officina's own assemblies (coverage.runsettings).
        run: >-
          dotnet test --no-build --configuration Release --blame-hang-timeout 2m
          ${{ matrix.os == 'ubuntu-latest' && '--collect "Code Coverage" --settings coverage.runsettings --results-directory coverage' || '' }}

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: python3 .github/coverage-summary.py coverage >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/**/*.cobertura.xml

  # Checks that need one OS only: formatting and known-vulnerable packages.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --no-restore --verify-no-changes

      - name: Vulnerable packages
        # bash here runs with pipefail, so a failing list command fails the step. The negated grep must stay last:
        # set -e ignores a negated command's status, so only the step's final status counts.
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
