name: CI

# TEST-03: the suite, in dotnet/, runs offline, on Linux and Windows. Warnings are errors (Directory.Build.props). It
# runs on every pull request, with no path filter, so its required checks always report; when a pull request changes
# only another implementation (go/, ruby/, their spikes and workflows), every job after `changes` is skipped, which a
# required check counts as passing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: dotnet-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.diff.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Comparing with the base branch needs its history.
          fetch-depth: 0

      - name: Diff
        id: diff
        run: python3 .github/changes.py dotnet >> "$GITHUB_OUTPUT"

  # Two jobs rather than a matrix: a skipped matrix job reports its name unexpanded, and the required checks need
  # these names exactly. Linux runs every test and measures coverage; Windows skips those that need Docker.
  ubuntu:
    name: ubuntu-latest
    needs: changes
    # Skipped only when the detector says false: if it fails, its output is empty and the jobs run.
    if: ${{ !cancelled() && needs.changes.outputs.dotnet != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      # Testcontainers' reaper is pulled from Docker Hub, which rate-limits these runners; a runner is thrown away after
      # the job, so nothing is left behind without it. Local runs keep it, as the shared database relies on it.
      TESTCONTAINERS_RYUK_DISABLED: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # A hanging test fails the run with a dump instead of stalling CI. Linux also measures coverage of Officina's
        # own assemblies (coverage.runsettings).
        run: >-
          dotnet test --no-build --configuration Release --blame-hang-timeout 2m
          --collect "Code Coverage" --settings coverage.runsettings --results-directory coverage

      - name: Coverage summary
        run: python3 ../.github/coverage-summary.py coverage >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: dotnet/coverage/**/*.cobertura.xml

  windows:
    name: windows-latest
    needs: changes
    # Skipped only when the detector says false: if it fails, its output is empty and the jobs run.
    if: ${{ !cancelled() && needs.changes.outputs.dotnet != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      TESTCONTAINERS_RYUK_DISABLED: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --blame-hang-timeout 2m

  # Checks that need one OS only: formatting, known-vulnerable packages, and the tests of the review gate, the Claude
  # Code hooks and scripts/ (.github/, .claude/ and scripts/ belong to .NET in .github/changes.py, so a change to any
  # of them runs them under this required check).
  quality:
    name: quality
    needs: changes
    # Skipped only when the detector says false: if it fails, its output is empty and the jobs run.
    if: ${{ !cancelled() && needs.changes.outputs.dotnet != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - name: Review gate tests
        run: python3 -m unittest discover --start-directory .github

      - name: Claude Code hook tests
        run: python3 -B -m unittest discover --start-directory .claude/hooks/tests

      - name: Agent usage script tests
        run: python3 -B -m unittest discover --start-directory scripts/tests

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: dotnet
        run: dotnet restore

      - name: Format
        working-directory: dotnet
        run: dotnet format --no-restore --verify-no-changes

      - name: Vulnerable packages
        # bash here runs with pipefail, so a failing list command fails the step. The negated grep must stay last:
        # set -e ignores a negated command's status, so only the step's final status counts.
        shell: bash
        working-directory: dotnet
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
