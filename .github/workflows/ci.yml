name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The Linux sandbox tests need the one-time root setup an installer does (DESIGN.md §7, S00a).
      - name: Set up the Linux sandbox host
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          # Ubuntu restricts unprivileged user namespaces; an AppArmor profile allows them for bwrap only.
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          # A systemd user manager delegates the cgroup controllers that limit commands.
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~Sleepyshark.Officina.Load.Tests"

      # TEST-33: on Linux the tests also measure the core's coverage, which must be at least 85%.
      - name: Test, with the core's coverage
        if: runner.os == 'Linux'
        run: |
          dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~Sleepyshark.Officina.Load.Tests" --collect "Code Coverage;Format=cobertura" --results-directory coverage
          python3 tests/core_coverage.py coverage

      # TEST-30: the load and latency tests measure time, so they run on their own, after the others, and print what they measured.
      - name: Load and latency tests
        run: dotnet test tests/Sleepyshark.Officina.Load.Tests --no-build --configuration Release --logger "console;verbosity=detailed"
