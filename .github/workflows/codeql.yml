name: CodeQL

# Static analysis for security flaws, such as injection or a secret in code, in the C#, the Go and these workflows. Results
# show in the repository's Security tab and as alerts on a pull request's changed lines.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries run against code that has not changed.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: matrix.build-mode == 'manual'
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build
        if: matrix.build-mode == 'manual'
        run: dotnet build --configuration Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
