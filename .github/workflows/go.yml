name: Go

# The Go implementation in go/: the suite offline on Linux and Windows (TEST-03), the quality gates and mutation
# testing. It runs on every pull request, with no path filter, so its required checks always report; when a pull
# request changes nothing under go/ (nor this workflow), every job after `changes` is skipped, which a required check
# counts as passing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: go
    shell: bash

jobs:
  changes:
    name: go-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Comparing with the base branch needs its history.
          fetch-depth: 0

      - name: Diff
        id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ] || ! git diff --quiet "origin/$BASE_REF...HEAD" -- go testdata .github/workflows/go.yml; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under go/ or testdata/ changed; the Go jobs are skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  # Two jobs rather than a matrix: a skipped matrix job reports its name unexpanded, and the required checks need
  # these names exactly.
  ubuntu:
    name: go-ubuntu
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps: &test
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test
        # The race detector needs cgo on Windows (the runner's MinGW gcc); Officina's own code uses none.
        env:
          CGO_ENABLED: "1"
        # The property tests (rapid) run with a fixed seed here, so CI is deterministic; locally each run draws a new
        # one, and a failure prints the seed that reproduces it. Only packages with property tests know the flag.
        run: |
          go test -race -shuffle=on $(go list ./... | grep -vx 'github.com/sleepyshark85/officina/go/officina')
          go test -race -shuffle=on ./officina -rapid.seed=20261009 -rapid.nofailfile

  windows:
    name: go-windows
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps: *test

  quality:
    name: go-quality
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Format
        # gofmt here; goimports runs as a golangci-lint formatter below.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: go

      - name: Tidy
        run: go mod tidy -diff

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  mutation:
    name: go-mutation
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Free disk space
        # Each mutant is built anew into the build cache, about 10 GB for one run, more than the runner has free:
        # a full disk ended the job as "cancelled". The toolchains removed here are ones this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Mutate
        # Every run mutates everything under officina/ whole (the core, the test kit, the Claude package and the MCP
        # client): they are small, and `--diff` cannot work from go/ (its
        # paths are relative to the repository, so it skipped every mutant). It fails below the thresholds in
        # go/.gremlins.yaml, set from Go S08's baseline (G12); gremlins v0.6.0 ignores the threshold flags. The default
        # timeout counts most mutants as timed out, hence the coefficient. gremlins tests each mutant in a copy of go/
        # alone, so the tests find the repository's shared testdata through OFFICINA_TESTDATA; without it every test
        # that reads a fixture fails, and every mutant counts as killed.
        env:
          OFFICINA_TESTDATA: ${{ github.workspace }}/testdata
          # Mutant timeouts come from the coverage run's duration, which a cached test result would make near zero.
          GOFLAGS: -count=1
        run: gremlins unleash --coverpkg ./officina/... --timeout-coefficient 20 ./officina
