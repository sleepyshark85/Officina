name: Go

# The Go implementation in go/: the suite offline on Linux and Windows (TEST-03), the quality gates and mutation
# testing. It runs on every pull request, with no path filter, so its required checks always report; when a pull
# request changes nothing of Go (.github/changes.py says what is), every job after `changes` is skipped, which a
# required check counts as passing.
on:
  push:
    branches: [main]
  pull_request:
  # For the full mutation run; the other jobs run as well, which also catches a newly published vulnerability.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: go
    shell: bash

jobs:
  changes:
    name: go-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Comparing with the base branch needs its history.
          fetch-depth: 0

      - name: Diff
        id: diff
        working-directory: .
        run: python3 .github/changes.py go >> "$GITHUB_OUTPUT"

  # Two jobs rather than a matrix: a skipped matrix job reports its name unexpanded, and the required checks need
  # these names exactly.
  ubuntu:
    name: go-ubuntu
    needs: changes
    # Skipped only when the detector says false: if it fails, its output is empty and the jobs run.
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps: &test
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test
        # The race detector needs cgo on Windows (the runner's MinGW gcc); Officina's own code uses none.
        env:
          CGO_ENABLED: "1"
        # The property tests (rapid) run with a fixed seed here, so CI is deterministic; locally each run draws a new
        # one, and a failure prints the seed that reproduces it. Only packages with property tests know the flag.
        run: |
          go test -race -shuffle=on $(go list ./... | grep -vx 'github.com/sleepyshark85/officina/go/officina')
          go test -race -shuffle=on ./officina -rapid.seed=20261009 -rapid.nofailfile

  windows:
    name: go-windows
    needs: changes
    # Skipped only when the detector says false: if it fails, its output is empty and the jobs run.
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps: *test

  quality:
    name: go-quality
    needs: changes
    # Skipped only when the detector says false: if it fails, its output is empty and the jobs run.
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Format
        # gofmt here; goimports runs as a golangci-lint formatter below.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: go

      - name: Tidy
        run: go mod tidy -diff

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  mutation:
    name: go-mutation
    needs: changes
    # Skipped only when the detector says false: if it fails, its output is empty and the jobs run.
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    # A full run takes about 26 minutes usually; a slow runner has taken 55, so leave room before it is cancelled.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Comparing with the base branch needs its history.
          fetch-depth: 0

      - name: Scope
        id: scope
        # A pull request that changes no code under officina/ (only tests, docs or other packages) has nothing to
        # mutate; gremlins would take its empty diff to mean everything.
        run: |
          if [ "${{ github.event_name }}" = pull_request ] &&
            git diff --quiet --merge-base "origin/${{ github.base_ref }}" -- 'officina/*.go' ':!*_test.go'; then
            echo "No code under go/officina changed: nothing to mutate."
            echo "mutate=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.scope.outputs.mutate != 'false'
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install gremlins
        if: steps.scope.outputs.mutate != 'false'
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Free disk space
        if: steps.scope.outputs.mutate != 'false'
        # Each mutant is built anew into the build cache, about 10 GB for one run, more than the runner has free:
        # a full disk ended the job as "cancelled". The toolchains removed here are ones this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Mutate
        if: steps.scope.outputs.mutate != 'false'
        # Everything under officina/ (the core, the test kit, the Claude package and the MCP client) on a push to main,
        # weekly and on demand; on a pull request, only the lines it changed there. Either fails below the thresholds
        # in go/.gremlins.yaml (G12); gremlins v0.6.0 ignores the threshold flags. gremlins names a mutant's file
        # relative to the folder it mutates and matches it against the paths of the `git diff` it runs where it is
        # started, so the diff run starts in officina/ with git's paths made relative to it. Changed lines that hold
        # no mutant (only comments or deletions) pass. The default timeout counts most mutants as timed out, hence
        # the coefficient. gremlins tests each mutant in a copy of go/ alone, so the tests find the repository's
        # shared testdata through OFFICINA_TESTDATA; without it every test that reads a fixture fails, and every
        # mutant counts as killed.
        env:
          OFFICINA_TESTDATA: ${{ github.workspace }}/testdata
          # Mutant timeouts come from the coverage run's duration, which a cached test result would make near zero.
          GOFLAGS: -count=1
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            gremlins unleash --coverpkg ./officina/... --timeout-coefficient 20 ./officina
            exit
          fi
          cd officina
          git config diff.relative true
          gremlins unleash --coverpkg ./officina/... --timeout-coefficient 20 --output-statuses lctkv \
            --diff "origin/${{ github.base_ref }}" 2>&1 | tee "$RUNNER_TEMP/gremlins.log" || {
            grep -qx 'Killed: 0, Lived: 0, Not covered: 0' "$RUNNER_TEMP/gremlins.log"
            echo "The changed lines hold no mutant: nothing to test, so the threshold error above does not count."
          }
