name: Mutation

# Stryker.NET on the library packages in dotnet/src/, each set up by its stryker-config.json. A pull request mutates
# only the files it changed and fails below the package's break threshold; the weekly and manual runs mutate everything
# and only report.
# The test runner is Stryker's Microsoft Testing Platform one, as the default runner does not reach xunit v3's tests.
# A pull request that changes only another implementation skips it, as ci.yml does.
on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: dotnet-mutation-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.diff.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff
        id: diff
        run: python3 .github/changes.py dotnet >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation
    needs: changes
    # Skipped only when the detector says false: if it fails, its output is empty and the jobs run.
    if: ${{ !cancelled() && needs.changes.outputs.dotnet != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Comparing with the base branch needs its history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        working-directory: dotnet
        run: dotnet tool restore

      - name: Mutate
        shell: bash
        working-directory: dotnet
        run: |
          status=0
          for package in Sleepyshark.Officina Sleepyshark.Officina.Claude Sleepyshark.Officina.Mcp; do
            echo "::group::$package"
            if [ "${{ github.event_name }}" = pull_request ]; then
              (cd "src/$package" && dotnet stryker --since:"origin/${{ github.base_ref }}" --skip-version-check) || status=1
            else
              (cd "src/$package" && dotnet stryker --break-at 0 --skip-version-check) || status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: dotnet/src/*/StrykerOutput/*/reports/
          if-no-files-found: ignore
