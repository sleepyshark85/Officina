name: Review

# The review gate: a pull request's "review" status passes only when the newest verdict naming its newest commit in full
# ("**Verdict: APPROVE** at <40-character sha>"), posted by the owner or a collaborator, approves. A new commit needs a
# new verdict; a short sha is not accepted, as a commit matching one can be forged. Comments run this workflow as it is
# on main, and it reads the pull request through the API only, never its code.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

# Runs for one pull request finish in order, so an older result never overwrites a newer one.
concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verdict:
    # A fork's pull_request run has a read-only token; its status is set on the next comment instead.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set the review status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          short=${head:0:7}
          verdict=$(gh api --paginate "repos/$REPO/issues/$PR/comments" | jq -rs --arg sha "$head" '
            [add[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
                   | select(.body | startswith("**Verdict:")) | select(.body | contains($sha))]
            | last | .body // ""')
          case "$verdict" in
            "**Verdict: APPROVE** at $head"*) state=success; description="Approved at $short" ;;
            "**Verdict:"*) state=failure; description="Changes requested at $short" ;;
            *) state=pending; description="Waiting for a verdict naming $short in full" ;;
          esac
          gh api "repos/$REPO/statuses/$head" -f state="$state" -f context=review -f description="$description" > /dev/null
          echo "review: $state ($description)"
