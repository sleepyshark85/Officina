# Bookshop Assistant's database (APP-04), telemetry dashboard (APP-20, D11) and export server (APP-12). Start them with
# ./start.sh (or pwsh -File start.ps1); the schema, seed, audit and sessions tables in database/ are created on the database's first start only.
# If a port is taken, set another in a .env file beside this one (git ignores it), such as BOOKSHOP_DB_PORT=5433, and
# change the matching setting in appsettings.Local.json.
# `docker compose down -v` deletes the data, so the next start seeds afresh.
services:
  postgres:
    # Docker Hub's official image through Google's public mirror, which CI pulls without Docker Hub's rate limit.
    image: mirror.gcr.io/library/postgres:17
    environment:
      POSTGRES_USER: bookshop
      # Distinct from the user and database names, so redacting it (EVT-03) leaves those readable.
      POSTGRES_PASSWORD: shelf-demo-41
      POSTGRES_DB: bookshop
    ports:
      - "${BOOKSHOP_DB_PORT:-5432}:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - bookshop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bookshop", "-d", "bookshop"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The standalone .NET Aspire dashboard: traces, metrics and logs, kept in memory while it runs. Open
  # http://localhost:18888; the application sends OTLP to localhost:4317. Ports: BOOKSHOP_DASHBOARD_PORT, BOOKSHOP_OTLP_PORT.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      # A local demo: no sign-in to the dashboard.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${BOOKSHOP_DASHBOARD_PORT:-18888}:18888"
      - "${BOOKSHOP_OTLP_PORT:-4317}:18889"

  # The reference filesystem MCP server (APP-12), over Streamable HTTP at http://localhost:18800/mcp, which sees only
  # the exports folder. It has no sign-in, so it listens on this machine only. Port: BOOKSHOP_EXPORTS_PORT.
  filesystem:
    build: ./exports-server
    ports:
      - "127.0.0.1:${BOOKSHOP_EXPORTS_PORT:-18800}:8000"
    volumes:
      - ./exports:/projects/exports
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  bookshop-data:
