<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="officina-run-loop-title officina-run-loop-desc">
      <title id="officina-run-loop-title">The agentic run loop</title>
      <desc id="officina-run-loop-desc">Flowchart showing a run checking its prefix, tool sources and budget, calling the model, and either running the reply's tool calls and calling the model again or ending as completed, stopped or failed.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M 300,96 L 300,128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 300,216 L 300,248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 300,336 L 300,368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 300,456 L 300,488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 300,552 L 300,584" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 300,672 L 300,704" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 160,736 L 104,736 Q 96,736 96,728 L 96,420 Q 96,412 104,412 L 200,412" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 400,172 L 792,172 Q 800,172 800,180 L 800,800" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 400,292 L 752,292 Q 760,292 760,300 L 760,800" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 400,412 L 712,412 Q 720,412 720,420 L 720,800" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 400,628 L 672,628 Q 680,628 680,636 L 680,800" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="320.0" y="227" width="24.8" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324.0" y="236" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
      <rect x="320.0" y="347" width="24.8" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324.0" y="356" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
      <rect x="320.0" y="467" width="24.8" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324.0" y="476" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
      <rect x="320.0" y="683" width="52.8" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324.0" y="692" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">TOOL_USE</text>
      <rect x="104.0" y="567" width="58.4" height="12" rx="2" fill="#f5f5f5"/>
      <text x="108.0" y="576" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">NEXT CALL</text>
      <rect x="525.2" y="155" width="69.6" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560.0" y="164" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO · FAILED</text>
      <rect x="525.2" y="275" width="69.6" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560.0" y="284" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO · FAILED</text>
      <rect x="522.4" y="395" width="75.2" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560.0" y="404" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO · STOPPED</text>
      <rect x="505.2" y="611" width="69.6" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540.0" y="620" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">END · OTHER</text>
      <rect x="160" y="40" width="280" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="160" y="40" width="280" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300.0" y="60.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run starts</text>
      <text x="300.0" y="75.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RunStarted audited · unanswered calls get</text>
      <text x="300.0" y="87.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error results so the history stays valid</text>
      <polygon points="300,128.0 400.0,172 300,216.0 200.0,172" fill="#f5f5f5"/>
      <polygon points="300,128.0 400.0,172 300,216.0 200.0,172" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="170" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prefix unchanged?</text>
      <text x="300" y="185" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fingerprint check</text>
      <polygon points="300,248.0 400.0,292 300,336.0 200.0,292" fill="#f5f5f5"/>
      <polygon points="300,248.0 400.0,292 300,336.0 200.0,292" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool sources up?</text>
      <text x="300" y="305" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">connect · reconnect</text>
      <polygon points="300,368.0 400.0,412 300,456.0 200.0,412" fill="#f5f5f5"/>
      <polygon points="300,368.0 400.0,412 300,456.0 200.0,412" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="410" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Budget left?</text>
      <text x="300" y="425" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">≤25 calls · run budget</text>
      <rect x="160" y="488" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="488" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="494" width="35" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="185.5" y="503" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="300.0" y="512.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Call the model</text>
      <text x="300.0" y="527.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prefix + history + this turn</text>
      <text x="300.0" y="539.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">streams text · blocks · usage</text>
      <polygon points="300,584.0 400.0,628 300,672.0 200.0,628" fill="#f5f5f5"/>
      <polygon points="300,584.0 400.0,628 300,672.0 200.0,628" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="300" y="626" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stop reason?</text>
      <text x="300" y="641" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stop_reason + tool calls</text>
      <rect x="160" y="704" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="704" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="710" width="35" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="185.5" y="719" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
      <text x="300.0" y="728.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Append reply, run tools</text>
      <text x="300.0" y="743.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">each call through the tool pipeline</text>
      <text x="300.0" y="755.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">results appended as one message</text>
      <rect x="640" y="800" width="200" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="640" y="800" width="200" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740.0" y="824.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run ends</text>
      <text x="740.0" y="839.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Completed · Stopped · Failed</text>
      <text x="740.0" y="851.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RunEnded event + audit entry</text>
      <text x="460" y="700" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">Cancelled mid-tools: every call</text>
      <text x="460" y="717" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">still gets its result, then</text>
      <text x="460" y="734" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">the run stops.</text>
      <line x1="40" y1="880" x2="840" y2="880" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="896" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="910" width="28" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="76" y="920" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>
      <rect x="156" y="910" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="192" y="920" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>
      <polygon points="253,908 267,916 253,924 239,916" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="275" y="920" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision on a structured signal</text>
      <rect x="451" y="910" width="28" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="487" y="920" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The structured signal that loops</text>

    </svg>
