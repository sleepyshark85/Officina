<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model request and caching</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
  --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
.frame { max-width: 1200px; width: 100%; }
.eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
  letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
.caption { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 60rem; line-height: 1.5; }
svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Layer stack · Officina design</p>
<h1>Model request and caching</h1>
<svg viewBox="0 0 960 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-request-title model-request-desc">
<title id="model-request-title">Model request and caching</title>
<desc id="model-request-desc">Layer stack of one model request, from tool definitions and instructions through project memory and append-only history to the volatile context, with three cache boundaries.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="112" y="80" width="680" height="60" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="128" y="114" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TOOLS</text><text x="240" y="115" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Tool definitions</text><text x="776" y="114" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">sorted by name · per model slot</text>
<rect x="112" y="140" width="680" height="60" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="128" y="174" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SYSTEM</text><text x="240" y="175" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Instructions and policies</text><text x="776" y="174" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">definition level only</text>
<rect x="112" y="200" width="680" height="60" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="128" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SYSTEM</text><text x="240" y="235" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Project memory</text><text x="776" y="234" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">changes reach new conversations</text>
<rect x="112" y="260" width="680" height="60" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="128" y="294" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MESSAGES</text><text x="240" y="295" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">History</text><text x="776" y="294" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">append-only · never edited</text>
<rect x="112" y="320" width="680" height="60" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="128" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAST</text><text x="240" y="355" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Volatile context</text><text x="776" y="354" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">facts · knowledge · findings · task</text>
<rect x="112" y="80" width="680" height="300" fill="none" stroke="#4f5d75" stroke-width="1"/>
<line x1="792" y1="200" x2="812" y2="200" stroke="#4f5d75" stroke-width="1.2"/><circle cx="820" cy="200" r="8" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="820" y="203" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text><text x="836" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CACHE · 1h</text>
<line x1="792" y1="260" x2="812" y2="260" stroke="#4f5d75" stroke-width="1.2"/><circle cx="820" cy="260" r="8" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="820" y="263" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">2</text><text x="836" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CACHE · 1h</text>
<line x1="792" y1="320" x2="812" y2="320" stroke="#eb6c36" stroke-width="1.2"/><circle cx="820" cy="320" r="8" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/><text x="820" y="323" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">3</text><text x="836" y="323" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CACHE · 5m</text>
<text x="64" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FIRST</text><line x1="64" y1="100" x2="64" y2="360" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><text x="64" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LAST</text>
<line x1="32" y1="428" x2="928" y2="428" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="439" width="20" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="140" y="448" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The rule that keeps caching and reasoning valid</text><line x1="421.8" y1="445" x2="441.8" y2="445" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="449.8" y="448" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Order sent to the model</text>
</svg>
<p class="caption">Every call only appends to the previous one. On Claude the volatile context is a turn-scoped system message, or, where that is unavailable, an appended text block that later calls in the turn extend with changes only (CTX-10, CTX-11).</p>
</div>
</body>
</html>
