<svg viewBox="0 0 960 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-request-title model-request-desc">
<title id="model-request-title">Model request and caching</title>
<desc id="model-request-desc">Layer stack of one model request, from tool definitions and instructions through project memory and append-only history to the volatile context, with three cache boundaries.</desc>
