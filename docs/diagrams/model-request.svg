<text x="128" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SYSTEM</text><text x="240" y="235" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Project memory</text><text x="776" y="234" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">changes reach new conversations</text>
