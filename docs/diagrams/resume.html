<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crash and resume</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
  --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
.frame { max-width: 1200px; width: 100%; }
.eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
  letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
.caption { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 60rem; line-height: 1.5; }
svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Sequence · Officina design</p>
<h1>Crash and resume</h1>
<svg viewBox="0 0 960 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="resume-title resume-desc">
<title id="resume-title">Crash and resume</title>
<desc id="resume-desc">Sequence of resuming a run after a crash: load the last checkpoint, reset worktrees, flag unfinished write intents for a human, then redo interrupted turns.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="120" y1="88" x2="120" y2="424" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="360" y1="88" x2="360" y2="424" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="600" y1="88" x2="600" y2="424" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="840" y1="88" x2="840" y2="424" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<path d="M 124,124 H 356" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 364,156 H 596" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 596,188 H 364" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M 364,220 H 836" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 364,252 H 596" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 596,284 H 364" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M 356,316 H 124" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
<path d="M 364,332 H 392 Q 400,332 400,340 V 348 Q 400,356 392,356 H 366" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 356,400 H 124" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="220" y="104" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="113" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESUME</text>
<rect x="450" y="136" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECKPOINT</text>
<rect x="440" y="168" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OFFSETS · SHAS</text>
<rect x="442" y="200" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="209" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESET TO SHAS</text>
<rect x="442" y="232" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN INTENTS?</text>
<rect x="440" y="264" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="273" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO OUTCOME YET</text>
<rect x="200" y="296" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="305" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FLAG FOR HUMAN</text>
<rect x="408" y="338" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="438" y="347" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDO TURNS</text>
<rect x="218" y="380" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="389" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESUMED</text>
<rect x="48" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="48" y="40" width="144" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="120" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Host</text><text x="120" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CLI</text>
<rect x="288" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="288" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="360" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run</text><text x="360" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resumed run</text>
<rect x="528" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="528" y="40" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="600" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Storage</text><text x="600" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite</text>
<rect x="768" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="768" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="840" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workspace</text><text x="840" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git worktrees</text>
<line x1="32" y1="440" x2="928" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="457" x2="132" y2="457" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="140" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Call</text><line x1="189.6" y1="457" x2="209.6" y2="457" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="217.6" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Reply</text><line x1="272.6" y1="457" x2="292.6" y2="457" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/><text x="300.6" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Notify</text><line x1="361.0" y1="457" x2="381.0" y2="457" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text x="389.0" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Outcome</text>
</svg>
<p class="caption">History is append-only, so a checkpoint is just message counts, record, task and memory revisions, and worktree commit SHAs. An irreversible call with an intent but no outcome is never re-run (TOOL-10, RUN-07).</p>
</div>
</body>
</html>
