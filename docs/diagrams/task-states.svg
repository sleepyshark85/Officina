<path d="M 528,200 H 584" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 696,200 H 752" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M 864,200 H 900" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 640,168 V 136 Q 640,128 632,128 H 472 Q 464,128 464,136 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M 432,232 V 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 400,352 H 320 Q 312,352 312,344 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 512,232 V 344 Q 512,352 520,352 H 584" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 640,384 V 408 Q 640,416 632,416 H 288 Q 280,416 280,408 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="176" y="180" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="204" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPS DONE</text>
<rect x="354" y="180" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="372" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>
<rect x="530" y="180" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="556" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFIED</text>
<rect x="696" y="180" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="724" y="189" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INTEGRATE</text>
<rect x="514" y="108" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="552" y="117" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHANGES ASKED</text>
<rect x="440" y="270" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="458" y="279" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLOCK</text>
<rect x="334" y="332" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="356" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNBLOCK</text>
<rect x="524" y="332" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="552" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXHAUSTED</text>
<rect x="422" y="396" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="460" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY · SPLIT</text>
<circle cx="32" cy="200" r="6" fill="#2d3142"/>
<circle cx="908" cy="200" r="8" fill="none" stroke="#2d3142" stroke-width="1"/><circle cx="908" cy="200" r="5" fill="#2d3142"/>
<rect x="64" y="168" width="112" height="64" rx="8" fill="#f5f5f5"/><rect x="64" y="168" width="112" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="120" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Proposed</text><text x="120" y="215" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">by the lead</text>
<rect x="232" y="168" width="112" height="64" rx="8" fill="#f5f5f5"/><rect x="232" y="168" width="112" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="288" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ready</text><text x="288" y="215" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deps done</text>
<rect x="400" y="168" width="128" height="64" rx="8" fill="#f5f5f5"/><rect x="400" y="168" width="128" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="464" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">In progress</text><text x="464" y="215" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one agent</text>
<rect x="584" y="168" width="112" height="64" rx="8" fill="#f5f5f5"/><rect x="584" y="168" width="112" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="640" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">In review</text><text x="640" y="215" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not the author</text>
<rect x="752" y="168" width="112" height="64" rx="8" fill="#f5f5f5"/><rect x="752" y="168" width="112" height="64" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="808" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Done</text><text x="808" y="215" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checks passed</text>
<rect x="400" y="320" width="96" height="64" rx="8" fill="#f5f5f5"/><rect x="400" y="320" width="96" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="448" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blocked</text><text x="448" y="367" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">waiting</text>
<rect x="584" y="320" width="112" height="64" rx="8" fill="#f5f5f5"/><rect x="584" y="320" width="112" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="640" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Failed</text><text x="640" y="367" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">back to lead</text>
<rect x="64" y="320" width="112" height="64" rx="8" fill="#f5f5f5"/><rect x="64" y="320" width="112" height="64" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/><text x="120" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cancelled</text><text x="120" y="367" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">by the owner</text>
<text x="120" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">* → CANCELLED</text>
<line x1="32" y1="460" x2="928" y2="460" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="471" width="20" height="12" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><text x="140" y="480" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Done only when checks pass</text><rect x="308.4" y="471" width="20" height="12" rx="3" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/><text x="336.4" y="480" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Reachable from any open state</text><line x1="521.0" y1="477" x2="541.0" y2="477" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="549.0" y="480" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rework</text>
</svg>
