<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team run</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
  --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
.frame { max-width: 1200px; width: 100%; }
.eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
  letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
.caption { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 60rem; line-height: 1.5; }
svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Sequence · Officina design</p>
<h1>Team run</h1>

<title id="team-run-title">Team run</title>
<desc id="team-run-desc">Sequence of a team run: the owner gives a goal, the lead plans tasks, the owner approves the plan, developers work tasks in parallel with review and integration, and the lead reports.</desc>

<rect x="348" y="136" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="384" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAN → TASKS</text>

<rect x="408" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="408" y="40" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="480" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Task board</text><text x="480" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">and integration queue</text>

<rect x="792" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="792" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="864" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer</text><text x="864" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never the author</text>

</svg>
<p class="caption">A task reaches done only when its verification checks pass, its review passes, and it integrates onto the current baseline with the baseline checks still passing. A conflict goes back to the author or the lead.</p>
