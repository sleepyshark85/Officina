<rect x="178" y="104" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="192" y="113" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOAL</text>
<rect x="348" y="136" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="384" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAN → TASKS</text>
<rect x="346" y="168" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="384" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVE PLAN?</text>
<rect x="166" y="200" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="192" y="209" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>
<rect x="404" y="244" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/><text x="424" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text><rect x="452" y="247" width="172" height="12" rx="2" fill="#f5f5f5"/><text x="456" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[per task, up to 4 in parallel]</text>
<rect x="546" y="272" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="576" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READY TASK</text>
<rect x="720" y="314" width="108" height="12" rx="2" fill="#f5f5f5"/><text x="774" y="323" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDIT · BUILD · TEST</text>
<rect x="556" y="344" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="576" y="353" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>
<rect x="748" y="376" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="768" y="385" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW</text>
<rect x="554" y="408" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="576" y="417" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>
<rect x="528" y="458" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="572" y="467" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REBASE + CHECKS</text>
<rect x="364" y="520" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="384" y="529" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>
<rect x="162" y="552" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="192" y="561" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN REPORT</text>
<rect x="24" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="24" y="40" width="144" height="48" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/><text x="96" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Owner</text><text x="96" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">human</text>
<rect x="216" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="216" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="288" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lead</text><text x="288" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent</text>
<rect x="408" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="408" y="40" width="144" height="48" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="0.8"/><text x="480" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Task board</text><text x="480" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">and integration queue</text>
<rect x="600" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="600" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="672" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Developer ×N</text><text x="672" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">own working copy</text>
<rect x="792" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="792" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="864" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer</text><text x="864" y="79" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never the author</text>
