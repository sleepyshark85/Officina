<path d="M 292,156 H 476" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 476,188 H 100" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 100,220 H 476" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M 484,292 H 668" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 676,308 H 704 Q 712,308 712,316 V 324 Q 712,332 704,332 H 678" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
