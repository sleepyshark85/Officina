plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  Exclude:
    # The dependency test's fixture gems: input it reads, never loaded, breaking the rules on purpose.
    - test/fixtures/**/*

# A test reads top to bottom as one example: its setup, the call, then each thing it checks. Splitting it to fit the
# method and class metrics would scatter one example over helpers, so tests are exempt from them, and may check a few
# more things than the Minitest default of three.
Metrics/AbcSize:
  Exclude:
    - '**/test/**/*'
Metrics/ClassLength:
  Exclude:
    - '**/test/**/*'
Metrics/MethodLength:
  Exclude:
    - '**/test/**/*'
Minitest/MultipleAssertions:
  Max: 5

# mutant 0.17 cannot parse the `it` block parameter: one in lib/ fails the whole mutation run. Tests may use it.
Style/ItBlockParameter:
  EnforcedStyle: disallow
  Include:
    - '**/lib/**/*.rb'
