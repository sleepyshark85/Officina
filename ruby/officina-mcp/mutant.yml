# Mutation testing of the MCP client with its own tests (test/), run from this directory: bundle exec mutant run.
usage: opensource
integration:
  name: minitest
includes:
  - lib
  - ../test
  - ../officina/lib
  - ../officina-testing/lib
requires:
  - sleepyshark/officina/mcp
matcher:
  subjects:
    - Sleepyshark::Officina::Mcp*
mutation:
  # The gem's tests take about a second; a mutation that leaves them waiting on a process or a socket is stopped
  # here, and counts as killed.
  timeout: 10.0
