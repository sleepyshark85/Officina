# Mutation testing of the core with its own tests (test/), run from this directory: bundle exec mutant run.
usage: opensource
integration:
  name: minitest
includes:
  - lib
  - ../test
hooks:
  - ../test/mutant_hooks.rb
requires:
  - sleepyshark/officina
matcher:
  subjects:
    - Sleepyshark::Officina*
